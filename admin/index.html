<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com; img-src 'self' https: blob: data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>管理 · Howard</title>
    <!-- brand-icons -->
    <link rel="stylesheet" href="frosted-glass.css" />
    <link rel="stylesheet" href="admin.css" />
    <link rel="stylesheet" href="katex/katex.min.css" />
    <script src="admin.js" type="module"></script>
  </head>
  <body>
    <header class="topbar frosted-panel">
      <a class="brand" href="../">h. <span>Howard / 管理</span></a>
      <div class="account">
        <button id="admin-theme" class="theme-control" type="button" aria-label="切换深色模式">
          <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.8 14a9 9 0 0 1-10.9-10.9A9 9 0 1 0 20.8 14Z" />
          </svg>
          <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        </button>
        <span id="account"></span><button id="reconnect" hidden>重新登录</button
        ><button id="logout" hidden>退出</button>
      </div>
    </header>
    <main>
      <section id="login-panel" class="login-panel frosted-panel" data-spotlight>
        <h1>管理</h1>
        <button id="login-button" class="primary">使用 GitHub 登录</button>
      </section>
      <nav id="admin-tabs" class="admin-tabs" aria-label="管理功能" hidden>
        <button id="tab-articles" aria-current="page">文章</button
        ><button id="tab-drafts">草稿箱</button><button id="tab-settings">页面设置</button>
      </nav>
      <div id="workspace" class="workspace" hidden>
        <aside class="article-sidebar frosted-panel" data-spotlight>
          <div class="list-heading">
            <h2 id="list-title">文章</h2>
            <button id="new-article" class="primary">新建</button>
          </div>
          <label for="search">搜索</label
          ><input id="search" type="search" placeholder="标题、专题、标签" />
          <p id="article-count" class="small"></p>
          <div id="article-list" class="article-list"></div>
        </aside>
        <section class="editor-panel">
          <div id="empty" class="empty"><h2>选择文章</h2></div>
          <form id="editor-form" hidden>
            <div class="editor-toolbar">
              <h2 id="editor-heading">编辑文章</h2>
              <div>
                <span id="save-state" class="small" role="status">已保存</span
                ><button id="reload" type="button">重新载入</button
                ><button id="download" type="button">下载</button
                ><button id="cancel-edit" type="button">取消</button>
                <button id="delete-draft" class="danger" type="button">删除</button>
                <button id="save-draft" type="submit" formnovalidate>存草稿</button>
                <button id="save" class="primary" type="submit">发布</button>
              </div>
            </div>
            <label class="title-label"
              >标题<input id="title" required maxlength="250" placeholder="文章标题"
            /></label>
            <div class="publish-fields">
              <label>专题<select id="category" required></select></label
              ><input id="published" type="hidden" value="false" />
              <span id="publication-state" class="publication-state">未发布</span>
              <label class="checkbox"><input id="featured" type="checkbox" />精选</label>
            </div>
            <details class="article-options">
              <summary>文章设置</summary>
              <div class="fields">
                <label>网址<input id="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" /></label
                ><label>创建日期<input id="date" type="date" required /></label>
                <label>标签<input id="tags" placeholder="逗号分隔" /></label
                ><label>摘要<input id="description" maxlength="500" /></label>
              </div>
              <button id="unpublish" type="button" hidden>从网站撤下</button>
            </details>
            <div class="writing-controls">
              <div class="view-switch" role="group" aria-label="编辑视图">
                <button type="button" data-view="edit" aria-pressed="false">编辑</button
                ><button type="button" data-view="split" aria-pressed="true">并排预览</button
                ><button type="button" data-view="preview" aria-pressed="false">预览</button>
              </div>
              <div>
                <button id="focus-mode" type="button" aria-pressed="false">专注</button
                ><a id="view-live" target="_blank" rel="noopener noreferrer">查看网页 ↗</a>
              </div>
            </div>
            <div id="format-toolbar" class="format-toolbar" role="toolbar" aria-label="文字格式">
              <select id="heading-format" aria-label="段落格式">
                <option value="">正文 / 标题</option>
                <option value="paragraph">正文</option>
                <option value="h1">一级标题</option>
                <option value="h2">二级标题</option>
                <option value="h3">三级标题</option>
              </select>
              <button type="button" data-format="bold" title="粗体 · Ctrl+B" aria-label="粗体">
                <b>B</b></button
              ><button type="button" data-format="italic" title="斜体 · Ctrl+I" aria-label="斜体">
                <i>I</i></button
              ><button type="button" data-format="strike" title="删除线" aria-label="删除线">
                <s>S</s></button
              ><button type="button" data-format="highlight" title="高亮" aria-label="高亮">
                标记
              </button>
              <span class="toolbar-separator"></span
              ><button type="button" data-format="h2" title="二级标题">H2</button
              ><button type="button" data-format="quote" aria-label="引用">引用</button
              ><button type="button" data-format="unordered" aria-label="无序列表">列表</button
              ><button type="button" data-format="ordered" aria-label="有序列表">1.</button
              ><button type="button" data-format="task" aria-label="任务列表">待办</button>
              <span class="toolbar-separator"></span
              ><button id="insert-link" type="button" title="链接 · Ctrl+K">链接</button
              ><button id="insert-image" type="button">图片</button
              ><input
                id="image"
                type="file"
                accept="image/png,image/jpeg,image/gif,image/webp,image/avif"
                multiple
                hidden
              />
              <button type="button" data-format="inline-code" aria-label="行内代码">
                &lt;/&gt;</button
              ><button type="button" data-format="code-block">代码块</button
              ><button type="button" data-format="table">表格</button
              ><button type="button" data-format="math-block">公式</button
              ><button type="button" data-format="mermaid">流程图</button
              ><button type="button" data-format="divider" aria-label="分隔线">—</button>
              <span class="toolbar-separator"></span
              ><button id="undo" type="button" title="撤销 · Ctrl+Z" aria-label="撤销">↶</button
              ><button id="redo" type="button" title="重做 · Ctrl+Shift+Z" aria-label="重做">
                ↷
              </button>
            </div>
            <div id="link-fields" class="link-fields" hidden>
              <label for="link-url">链接地址</label
              ><input id="link-url" type="text" inputmode="url" placeholder="https://" /><button
                id="apply-link"
                type="button"
              >
                插入</button
              ><button id="cancel-link" type="button">取消</button>
            </div>
            <div id="writing-area" class="writing-area" data-view="split">
              <textarea
                id="body"
                aria-label="Markdown 原文"
                spellcheck="false"
                wrap="soft"
              ></textarea>
              <article id="preview" class="preview" aria-label="实时预览"></article>
            </div>
            <div class="writing-status">
              <span id="word-count">0 字</span><span id="image-destination"></span
              ><label><input id="sync-scroll" type="checkbox" checked />同步滚动</label
              ><span id="preview-state" aria-live="polite"></span>
            </div>
          </form>
        </section>
      </div>
      <section id="settings-workspace" class="settings-workspace" hidden>
        <form id="site-form">
          <div class="editor-toolbar">
            <h2>页面设置</h2>
            <div>
              <span id="settings-state" class="small">已保存</span
              ><button id="reload-settings" type="button">重新载入</button
              ><button id="export-settings" type="button">导出</button
              ><button id="save-layout-draft" type="button">暂存草稿</button
              ><button id="restore-settings" type="button">恢复上一版</button
              ><button id="save-settings" class="primary" type="submit">发布页面</button>
            </div>
          </div>
          <div class="settings-grid">
            <div class="settings-fields">
              <fieldset>
                <legend>图片托管</legend>
                <div class="fields">
                  <label
                    >仓库<input
                      id="image-repository"
                      data-setting="imageHost.repository"
                      placeholder="账号/仓库名"
                      required
                      maxlength="200"
                  /></label>
                  <label
                    >目录<input
                      id="image-directory"
                      data-setting="imageHost.directory"
                      placeholder="img"
                      maxlength="300"
                  /></label>
                  <label
                    >分支<input
                      id="image-branch"
                      data-setting="imageHost.branch"
                      required
                      maxlength="200"
                  /></label>
                </div>
                <div class="image-host-actions">
                  <button id="test-image-host" type="button">检查连接</button>
                  <a id="authorize-images" target="_blank" rel="noopener noreferrer" hidden
                    >仓库授权 ↗</a
                  >
                  <span id="image-host-state" role="status" class="small"></span>
                </div>
              </fieldset>
              <fieldset>
                <legend>首页</legend>
                <div class="fields">
                  <label
                    >首页模板<select data-setting="pages.homeTemplate">
                      <option value="classic">当前布局</option>
                      <option value="articles">文章为主</option>
                      <option value="knowledge">知识库为主</option>
                    </select></label
                  >
                  <label>标题<input data-setting="home.title" required maxlength="80" /></label
                  ><label>副标题<input data-setting="home.description" maxlength="200" /></label
                  ><label
                    >布局<select data-setting="home.layout">
                      <option value="single">单栏</option>
                      <option value="split">双栏</option>
                    </select></label
                  ><label
                    >间距<select data-setting="home.density">
                      <option value="comfortable">宽松</option>
                      <option value="compact">紧凑</option>
                    </select></label
                  ><label
                    >强调色<select data-setting="accent">
                      <option value="green">松绿</option>
                      <option value="blue">灰蓝</option>
                      <option value="ochre">赭黄</option>
                    </select></label
                  >
                </div>
                <label class="inline-check"
                  ><input type="checkbox" data-setting="home.activityPinned" />热图固定在底部</label
                >
                <div id="section-settings" class="ordered-settings"></div>
              </fieldset>
              <fieldset>
                <legend>模板与样式</legend>
                <div class="fields">
                  <label
                    >专题布局<select data-setting="pages.topicLayout">
                      <option value="list">纵向列表</option>
                      <option value="cards">卡片布局</option>
                    </select></label
                  >
                  <label
                    >专题预览篇数<select data-setting="pages.topicPreviewCount" data-number>
                      <option value="3">3 篇</option>
                      <option value="4">4 篇</option>
                      <option value="5">5 篇</option>
                    </select></label
                  >
                  <label
                    >阅读布局<select data-setting="pages.articleLayout">
                      <option value="wide">宽屏</option>
                      <option value="centered">居中</option>
                    </select></label
                  >
                  <label>中文字体<select data-setting="design.chineseFont"></select></label>
                  <label>英文字体<select data-setting="design.englishFont"></select></label>
                  <label>浅色主色<input type="color" data-setting="design.accentColor" /></label>
                  <label
                    >深色主色<input type="color" data-setting="design.darkAccentColor"
                  /></label>
                  <label
                    >正文字号<input
                      type="number"
                      min="14"
                      max="22"
                      step="1"
                      data-number
                      data-setting="design.fontSize"
                  /></label>
                  <label
                    >正文行距<input
                      type="number"
                      min="1.4"
                      max="2.4"
                      step="0.05"
                      data-number
                      data-setting="design.lineHeight"
                  /></label>
                  <label
                    >正文最大宽度<input
                      type="number"
                      min="760"
                      max="1440"
                      step="10"
                      data-number
                      data-setting="design.contentWidth"
                  /></label>
                  <label
                    >卡片间距<input
                      type="number"
                      min="8"
                      max="40"
                      step="1"
                      data-number
                      data-setting="design.cardGap"
                  /></label>
                  <label
                    >圆角<input
                      type="number"
                      min="0"
                      max="24"
                      step="1"
                      data-number
                      data-setting="design.radius"
                  /></label>
                </div>
                <p class="small">使用设备已安装的字体，缺少时自动回退。</p>
                <button id="reset-design" type="button">恢复默认样式</button>
              </fieldset>
              <fieldset>
                <legend>专题标签</legend>
                <div id="topic-settings" class="ordered-settings"></div>
                <div class="add-topic">
                  <label for="new-topic">新增专题</label
                  ><input id="new-topic" placeholder="专题名称" maxlength="60" /><button
                    id="add-topic"
                    type="button"
                  >
                    添加
                  </button>
                </div>
              </fieldset>
              <fieldset>
                <legend>文章入口</legend>
                <div id="collection-settings" class="ordered-settings"></div>
              </fieldset>
              <fieldset>
                <legend>站点与导航</legend>
                <div class="fields">
                  <label>站点名称<input data-setting="brand.name" maxlength="40" required /></label
                  ><label>站点副标题<input data-setting="brand.subtitle" maxlength="60" /></label
                  ><label>标识<input data-setting="brand.mark" maxlength="5" required /></label
                  ><label>页脚<input data-setting="footer" maxlength="100" /></label>
                </div>
                <div id="navigation-settings" class="ordered-settings"></div>
              </fieldset>
              <fieldset>
                <legend>关于页</legend>
                <label>页面标题<input data-setting="about.title" maxlength="80" required /></label
                ><label
                  >页面内容<textarea
                    data-setting="about.body"
                    rows="8"
                    maxlength="30000"
                  ></textarea>
                </label>
              </fieldset>
            </div>
            <aside
              class="layout-preview-panel frosted-panel"
              id="site-preview-panel"
              data-spotlight
            >
              <div class="site-preview-toolbar">
                <label
                  >页面<select id="preview-page">
                    <option value="home">首页</option>
                    <option value="topics">专题</option>
                    <option value="notes">文章列表</option>
                    <option value="article">阅读页</option>
                  </select></label
                >
                <label
                  >尺寸<select id="preview-device">
                    <option value="desktop">桌面</option>
                    <option value="tablet">平板</option>
                    <option value="mobile">手机</option>
                  </select></label
                >
                <label
                  >主题<select id="preview-theme">
                    <option value="light">浅色</option>
                    <option value="dark">深色</option>
                  </select></label
                >
                <button id="expand-site-preview" type="button">展开预览</button>
                <button id="retry-site-preview" type="button">重试</button>
              </div>
              <select id="preview-article" aria-label="预览文章" hidden></select>
              <span id="site-preview-state" role="status" class="small"></span>
              <div id="site-preview-stage" class="site-preview-stage">
                <iframe
                  id="site-preview-frame"
                  title="完整页面预览"
                  sandbox="allow-scripts allow-same-origin"
                ></iframe>
              </div>
            </aside>
          </div>
        </form>
      </section>
      <div id="status" role="status" aria-live="polite" hidden></div>
    </main>
  </body>
</html>
