configuration:
  pageTitle: Howard 的技术笔记
  pageTitleSuffix: " | Howard"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: zh-CN
  baseUrl: leiguo0812.github.io/howard-notes
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - "**/.*"
  theme:
    fontOrigin: local
    cdnCaching: true
    typography:
      header: Microsoft YaHei
      body: Microsoft YaHei
      code: Cascadia Code
    colors:
      lightMode:
        light: "#f4f6f9"
        lightgray: "#dce2eb"
        gray: "#657184"
        darkgray: "#354154"
        dark: "#1c2738"
        secondary: "#365f8b"
        tertiary: "#2c527c"
        highlight: rgba(54,95,139,0.08)
        textHighlight: "#a9cbe354"
      darkMode:
        light: "#1a1e25"
        lightgray: "#343d49"
        gray: "#a2aebe"
        darkgray: "#c7d0dc"
        dark: "#edf2f9"
        secondary: "#93bbdf"
        tertiary: "#b2d1eb"
        highlight: rgba(147,187,223,0.09)
        textHighlight: "#49739366"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: left
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: absolute
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: false
      rssLimit: 20
      rssFullHtml: false
  - source: "@quartz-community/favicon"
    enabled: false
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: left
      priority: 10
    options:
      localGraph:
        depth: 2
        scale: 1.0
        fontSize: 0.75
        opacityScale: 4.75
        linkDistance: 65
        repelForce: 0.8
      globalGraph:
        depth: -1
        fontSize: 0.8
        opacityScale: 2.5
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: header
      priority: 20
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: header
      priority: 30
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    options:
      rootName: 首页
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: "---"
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
layout:
  byPageType:
    content:
      template: blog
    folder:
      template: blog
    tag:
      template: blog
    "404":
      template: blog
